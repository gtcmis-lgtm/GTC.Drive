<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>司機出勤登錄系統</title>
</head>
<body leftmargin="0" topmargin="0" marginwidth="0" marginheight="0" name='prtbody' id='prtbody'>
X:<input type="text" name="PX" id="PX" value="" readonly>
Y:<input type="text" name="PY" id="PY" value="" readonly>
<script>
function goLogin(){
	var url = "http://218.211.169.149:8080/EMP/EMP_Login.jsp";
	var px = document.getElementById("PX").value;
	var py = document.getElementById("PY").value;
	if(px !== "" || py !== ""){
		url += "?PX=" + encodeURIComponent(px) + "&PY=" + encodeURIComponent(py);
	}
	window.location.href = url;
}
function smt(){
	if(!("geolocation" in navigator)){
		alert("此瀏覽器不支援定位程式，將直接進入登入頁。");
		goLogin();
		return;
	}
	navigator.geolocation.getCurrentPosition(showPosition, showError, {enableHighAccuracy:true, timeout:8000, maximumAge:0});
}
function showError(){
	alert("無法取得定位，將直接進入登入頁。");
	goLogin();
}
function showPosition(position){
	var x = position.coords.latitude;
	var y = position.coords.longitude;
	document.getElementById("PX").value = x;
	document.getElementById("PY").value = y;
	if(x>25.002160 || x<25.000200 || y>121.48650 || y<121.48400){
		alert("你的定位不在有效範圍,無法登入~!!!");
		return;
	}
	goLogin();
}
smt();
</script>
</body>
</html>
