<script>
function smt(){
	//alert("geolocation");
	//alert("geolocation" in navigator);
  if("geolocation" in navigator) {
    navigator.geolocation.getCurrentPosition(showPosition);
  } else { 
    alert("此瀏覽器不支援定位程式!!!");
  }
}
function showPosition(position) {
	  var c=0;
	  var x = position.coords.latitude ; 
	  var y = position.coords.longitude;
	  PX.value=x;
	  PY.value=y;
	  
		if(x>25.002160 || x<25.000200 || y>121.48650 || y<121.48400){
	  	alert("你的定位不在有效範圍,無法登入~!!!");	
	  	c=1;
	  }else{
			c=0;
		}
	  if(c==0){
				var smt_chk = document.getElementsByName("smt_chk");
				smt_chk[0].value="";
				document.form1.submit();
		}
}
smt();
</script>
